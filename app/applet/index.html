    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign Vite HMR WebSocket connection errors when HMR is disabled
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && typeof event.reason.message === 'string' && (event.reason.message.includes('WebSocket closed without opened') || event.reason.message.includes('failed to connect to websocket'))) {
          event.preventDefault();
        }
      });
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
          return;
        }
        originalConsoleError.apply(console, args);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
